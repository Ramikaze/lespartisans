<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070c18;color:#e8e2d0;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}

.wrap{text-align:center;padding:40px;max-width:480px;position:relative;z-index:1}
.icon{font-size:4rem;margin-bottom:24px;filter:drop-shadow(0 0 20px rgba(201,168,76,0.3))}
.title{font-family:'Cinzel',serif;font-size:1.6rem;font-weight:700;color:#c9a84c;margin-bottom:12px}
.desc{color:#5a6480;font-size:0.95rem;line-height:1.7;margin-bottom:32px}

</style>
<link rel="stylesheet" href="ios-theme.css">

<style id="lp-console-skin">/* Design « Console » — bibliotheque */
/* Fond : la nuit et sa brume ; l'ancien motif s'efface */
html[data-design="console"] body::before{ display:none!important; }
html[data-design="console"] body{ width:100%; background-image:var(--lp-motes),var(--lp-fog)!important; background-repeat:no-repeat!important; background-position:top center!important; background-size:1400px 460px,auto,auto!important; }

/* État vide : la niche (mishkât) reste creuse, comme la dalle « Bibliothèque » de l'accueil ;
   son mot y veille, éteint — ni ambre ni halo tant que la rubrique n'est pas ouverte */
html[data-design="console"] .wrap{ display:flex; flex-direction:column; align-items:center; max-width:640px!important; padding:40px 24px!important; }
html[data-design="console"] .icon{
  position:relative; display:grid; place-items:center; width:96px; height:140px; margin:0 0 42px!important; padding-top:18px; border-radius:48px 48px 16px 16px;
  font-size:0!important; filter:none!important;
  background:rgba(0,0,0,.28); border:1px dashed var(--lp-edge)!important; box-shadow:none;
}
html[data-design="console"][data-lp-theme="light"] .icon{ background:rgba(30,48,90,.05); }
html[data-design="console"] .icon svg{ display:none!important; }
html[data-design="console"] .icon::after{ content:var(--lp-mark); font-family:var(--lp-ar); font-size:22px; line-height:1.3; color:var(--lp-ink-3); }

/* Le titre fin, la phrase, l'état */
html[data-design="console"] .title{ margin:0 0 14px!important; font-family:var(--lp-font)!important; font-size:clamp(2.2rem,6vw,3.2rem)!important; font-weight:200!important; line-height:1.05!important; letter-spacing:-.025em!important; color:var(--lp-ink)!important; }
html[data-design="console"] .desc{ max-width:54ch; margin:0 auto 28px!important; font-family:var(--lp-font)!important; font-size:1.02rem!important; font-weight:300!important; line-height:1.65!important; color:var(--lp-ink-2)!important; text-wrap:balance; }
html[data-design="console"] .badge{ padding:7px 16px!important; border-radius:999px!important; font-family:var(--lp-font)!important; font-size:.84rem!important; font-weight:400!important; letter-spacing:0!important; text-transform:none!important; color:var(--lp-ink-2)!important; background:var(--lp-fill)!important; border:1px solid var(--lp-edge)!important; }
</style>
</head>
<body>
<div class="wrap">

</style>
<!-- Theme listener: receives theme from parent portal -->
<script>
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'theme') {
    var t = e.data.theme;
    document.documentElement.setAttribute('data-theme', t);
    document.body.setAttribute('data-theme', t === 'light' ? '' : 'dark');
    // Also try calling the module's own theme function
    try { if (typeof setTheme === 'function') setTheme(t); } catch(ex) {}
    try { if (typeof S !== 'undefined' && S.th !== undefined) { S.th = t === 'light' ? 'light' : 'dark'; document.body.setAttribute('data-theme', S.th); } } catch(ex) {}
    // Force canvas/render update
    try { window.dispatchEvent(new Event('resize')); } catch(ex) {}
  }
});
try {
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.body.setAttribute('data-theme', '');
    try { if (typeof S !== 'undefined') { S.th = 'light'; document.body.setAttribute('data-theme', 'light'); } } catch(ex) {}
  }
} catch(e) {}
</script>
</body>
