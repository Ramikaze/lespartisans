<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidéos — Les Partisans</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='%23c9a84c' stroke-width='8'><rect x='22' y='22' width='56' height='56' rx='8'/><rect x='22' y='22' width='56' height='56' rx='8' transform='rotate(45 50 50)'/><circle cx='50' cy='50' r='12' fill='%23c9a84c'/></g></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#070c18;color:#e2d9c4;font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;line-height:1.6}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23c9a84c' stroke-width='0.3' opacity='0.05'%3E%3Crect x='22' y='22' width='56' height='56' rx='2'/%3E%3Crect x='22' y='22' width='56' height='56' rx='2' transform='rotate(45 50 50)'/%3E%3Ccircle cx='50' cy='50' r='28'/%3E%3C/g%3E%3C/svg%3E");background-size:100px;pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#070c18}::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.3);border-radius:3px}

.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1}
.hero{text-align:center;margin-bottom:40px}
.hero-ornament{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:20px}
.orn-line{height:1px;width:70px;background:linear-gradient(to right,transparent,#c9a84c)}.orn-line.r{background:linear-gradient(to left,transparent,#c9a84c)}
.orn-gem{width:6px;height:6px;background:#c9a84c;transform:rotate(45deg);box-shadow:0 0 6px rgba(201,168,76,0.5)}
.hero-label{font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:#c9a84c;opacity:0.6;margin-bottom:14px}
.hero-title{font-family:'Cinzel',serif;font-size:clamp(1.3rem,3.5vw,2rem);font-weight:700;color:#e8e2d0;line-height:1.25;margin-bottom:8px}
.hero-title span{color:#c9a84c}
.hero-sub{font-size:0.95rem;color:#5a6480}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}

.video-card{background:rgba(19,29,53,0.7);border:1px solid rgba(201,168,76,0.12);border-radius:14px;overflow:hidden;transition:all .3s}
.video-card:hover{border-color:rgba(201,168,76,0.35);box-shadow:0 8px 28px rgba(0,0,0,0.35),0 0 16px rgba(201,168,76,0.06)}

.video-thumb{position:relative;width:100%;padding-bottom:56.25%;background:#0a1628;cursor:pointer;overflow:hidden}
.video-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s,opacity .3s}
.video-card:hover .video-thumb img{transform:scale(1.03);opacity:0.85}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;background:rgba(201,168,76,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,0.5);transition:transform .2s,background .2s;z-index:2}
.play-btn:hover{transform:translate(-50%,-50%) scale(1.1);background:#c9a84c}
.play-btn svg{width:24px;height:24px;margin-left:3px}

.video-embed{position:relative;width:100%;padding-bottom:56.25%;background:#000}
.video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

.video-info{padding:16px 18px}
.video-num{font-family:'Cinzel',serif;font-size:0.7rem;letter-spacing:.15em;text-transform:uppercase;color:#c9a84c;opacity:0.6;margin-bottom:4px}
.video-title{font-size:1rem;font-weight:600;color:#e8e2d0;line-height:1.4;margin-bottom:6px}
.video-channel{font-size:0.82rem;color:#5a6480}

/* Light theme */
[data-theme="light"] body{background:#e8e0d4!important;color:#2c2114!important}
[data-theme="light"] body::before{opacity:0.4!important}
[data-theme="light"] .hero-title{color:#2c2114!important}
[data-theme="light"] .hero-title span{color:#7a5c24!important}
[data-theme="light"] .hero-label{color:#7a5c24!important}
[data-theme="light"] .hero-sub{color:#7a6e56!important}
[data-theme="light"] .video-card{background:rgba(235,228,216,0.7)!important;border-color:rgba(122,92,36,0.12)!important}
[data-theme="light"] .video-card:hover{border-color:rgba(122,92,36,0.3)!important;box-shadow:0 8px 28px rgba(60,45,20,0.1)!important}
[data-theme="light"] .video-num{color:#7a5c24!important}
[data-theme="light"] .video-title{color:#2c2114!important}
[data-theme="light"] .video-channel{color:#7a6e56!important}
[data-theme="light"] .play-btn{background:rgba(122,92,36,0.85)!important}
[data-theme="light"] .video-thumb{background:#d8d0c0!important}
[data-theme="light"] ::-webkit-scrollbar-track{background:#e8e0d4!important}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(122,92,36,0.25)!important}

@media(max-width:600px){
  .wrap{padding:28px 14px 60px}
  .grid{grid-template-columns:1fr;gap:16px}
  .video-info{padding:14px 16px}
}
</style>
<link rel="stylesheet" href="ios-theme.css">
<style>
/* ===== iOS deep pass — videos ===== */
.video-card{border-radius:18px!important}
.play-btn{transition:transform .2s var(--ios-ease),background .2s!important}
.play-btn:hover{transform:translate(-50%,-50%)!important}
.play-btn:active{transform:translate(-50%,-50%) scale(.92)!important}
/* Clavier : la carte rogne l'anneau de la vignette (overflow:hidden) ; l'anneau passe sur la carte */
.video-card:has(.video-thumb:focus-visible){outline:2px solid rgba(201,168,76,0.65);outline-offset:2px}
.video-card:has(.video-thumb:focus-visible) .video-thumb{outline:none}
/* role="button" : la vignette garde son allure (ios-theme.css donne police, transitions et enfoncement aux boutons) */
.video-thumb[role="button"]{font-family:inherit;transition:none}
.video-thumb[role="button"]:active{transform:none}
</style>
<!-- Design « Console » (lp-design.js : 'console' ou 'classique') -->
<script src="lp-design.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="console.css">
<style id="lp-console-skin">/* Design « Console » — videos */
/* Fond : la nuit et sa brume ; l'ancien motif s'efface */
html[data-design="console"] body::before{ display:none!important; }
html[data-design="console"] body{ background-image:var(--lp-motes),var(--lp-fog)!important; background-repeat:no-repeat!important; background-position:top center!important; background-size:1400px 460px,auto,auto!important; }

/* En-tête : dalle de la rubrique مرئيات et titre d'un seul ton (console.css), sous-titre dessous, contexte en bas */
html[data-design="console"] .wrap:has(> .hero){ max-width:1120px!important; }
html[data-design="console"] .hero > .hero-sub{ order:2; max-width:600px; margin:16px auto 0!important; font-family:var(--lp-font)!important; font-size:1.02rem!important; font-weight:300!important; line-height:1.6!important; color:var(--lp-ink-2)!important; text-wrap:balance; }

/* Cartes : une dalle de verre qui sertit l'écran */
html[data-design="console"] .grid{ gap:18px!important; }
html[data-design="console"] .video-card{
  padding:9px!important; background:var(--lp-glass)!important; border:1px solid var(--lp-edge)!important; border-radius:20px!important;
  box-shadow:var(--lp-panel-shadow)!important; transition:border-color .5s var(--lp-ease),box-shadow .5s var(--lp-ease)!important;
}
html[data-design="console"] .video-card:hover{ border-color:rgba(var(--lp-glow),.42)!important; box-shadow:var(--lp-panel-shadow),0 0 36px -12px rgba(var(--lp-glow),.5)!important; }
/* L'écran : vignette ou lecteur, bordé d'un fil de verre */
html[data-design="console"] .video-thumb,
html[data-design="console"] .video-embed{ border-radius:12px; overflow:hidden; isolation:isolate; }
html[data-design="console"] .video-thumb{ background:var(--lp-void-2)!important; }
html[data-design="console"] .video-thumb::after{ content:''; position:absolute; inset:0; z-index:1; border-radius:inherit; pointer-events:none; box-shadow:inset 0 0 0 1px var(--lp-edge),inset 0 1px 0 rgba(255,255,255,.08); }
html[data-design="console"] .video-thumb img{ transition:transform .7s var(--lp-ease),opacity .4s var(--lp-ease)!important; }
html[data-design="console"] .video-card:hover .video-thumb img{ opacity:.92!important; }
/* Lecture : un disque de verre éclairé d'ambre */
html[data-design="console"] .play-btn{
  width:58px!important; height:58px!important; z-index:2!important;
  background:radial-gradient(120% 150% at 50% 125%,rgba(var(--lp-glow),.30),transparent 70%),rgba(5,8,16,.58)!important;
  border:1px solid rgba(var(--lp-glow),.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 22px -6px rgba(var(--lp-glow),.55),0 12px 28px -12px rgba(0,0,0,.7)!important;
  -webkit-backdrop-filter:blur(10px) saturate(140%); backdrop-filter:blur(10px) saturate(140%);
  transition:box-shadow .4s var(--lp-ease),transform .2s var(--lp-ease)!important;
}
html[data-design="console"] .play-btn svg{ width:22px!important; height:22px!important; fill:var(--lp-amber); }
/* Clavier : l'anneau d'ambre reste sur l'écran (la marge de verre le laisse voir), pas sur la carte */
html[data-design="console"] .video-card:has(.video-thumb:focus-visible){ outline:none!important; }
html[data-design="console"] .video-card:hover .play-btn{ box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 36px -4px rgba(var(--lp-glow),.75),0 12px 28px -12px rgba(0,0,0,.7)!important; }
html[data-design="console"][data-lp-theme="light"] .play-btn{ background:radial-gradient(120% 150% at 50% 125%,rgba(var(--lp-glow),.26),transparent 70%),rgba(255,255,255,.8)!important; border-color:rgba(160,100,20,.45); }

/* Légende : le titre d'abord, puis « Vidéo n · Les Partisans » en ligne de contexte */
html[data-design="console"] .video-info{ display:grid; grid-template-columns:auto minmax(0,1fr); grid-template-areas:"title title" "num chan"; align-items:baseline; padding:14px 10px 8px!important; }
html[data-design="console"] .video-title{ grid-area:title; margin:0 0 6px!important; font-family:var(--lp-font)!important; font-size:1rem!important; font-weight:400!important; line-height:1.42!important; letter-spacing:-.005em; color:var(--lp-ink)!important; text-wrap:pretty; }
html[data-design="console"] .video-num{ grid-area:num; margin:0!important; font-family:var(--lp-font)!important; font-size:.8rem!important; font-weight:300!important; letter-spacing:0!important; text-transform:none!important; color:var(--lp-ink-3)!important; opacity:1!important; font-variant-numeric:tabular-nums; }
html[data-design="console"] .video-channel{ grid-area:chan; font-size:.8rem!important; font-weight:300!important; color:var(--lp-ink-3)!important; }
html[data-design="console"] .video-channel::before{ content:'·'; margin:0 .5em; }

@media (max-width:600px){
  html[data-design="console"] .video-card{ padding:8px!important; }
  html[data-design="console"] .video-info{ padding:12px 8px 6px!important; }
}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
<div class="hero-label">Cha&#238;ne YouTube</div>
<div class="hero-ornament"><div class="orn-line"></div><div class="orn-gem"></div><div class="orn-line r"></div></div>
<h1 class="hero-title">Les <span>Partisans</span> &mdash; Vid&#233;os</h1>
<div class="hero-sub">Conf&#233;rences, enseignements et documentaires islamiques</div>
</div>

<div class="grid" id="videoGrid"></div>
</div>

<script>
var VIDEOS = [
  {id:"1Zu2zt9NsmA", title:"Vid\u00e9o 1"},
  {id:"KRylBQAvTGU", title:"Vid\u00e9o 2"},
  {id:"oF7r_-E45jA", title:"Vid\u00e9o 3"},
  {id:"gf9wxiIeUy0", title:"Vid\u00e9o 4"},
  {id:"A5k8sPrYO14", title:"Vid\u00e9o 5"},
  {id:"BV_xNLt5hfQ", title:"Vid\u00e9o 6"},
  {id:"umzxiK9Nvkc", title:"Vid\u00e9o 7"},
  {id:"EE1-FZqcPHY", title:"Vid\u00e9o 8"},
  {id:"pjaPsRkAda0", title:"Vid\u00e9o 9"}
];

var grid = document.getElementById('videoGrid');

VIDEOS.forEach(function(v, i) {
  var card = document.createElement('div');
  card.className = 'video-card';
  card.innerHTML =
    '<div class="video-thumb" id="thumb-' + v.id + '" tabindex="0" role="button" aria-label="Lire la vid\u00e9o \u00ab ' + v.title + ' \u00bb">' +
      '<img src="https://img.youtube.com/vi/' + v.id + '/hqdefault.jpg" alt="' + v.title + '" loading="lazy">' +
      '<div class="play-btn"><svg viewBox="0 0 24 24" fill="#070c18"><polygon points="8,5 19,12 8,19"/></svg></div>' +
    '</div>' +
    '<div class="video-info">' +
      '<div class="video-num">Vid\u00e9o ' + (i + 1) + '</div>' +
      '<div class="video-title" id="title-' + v.id + '">' + v.title + '</div>' +
      '<div class="video-channel">Les Partisans</div>' +
    '</div>';
  grid.appendChild(card);

  // Click to play: replace thumbnail with iframe
  card.querySelector('.video-thumb').addEventListener('click', function() {
    var embed = document.createElement('div');
    embed.className = 'video-embed';
    embed.innerHTML = '<iframe src="https://www.youtube.com/embed/' + v.id + '?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>';
    this.parentNode.replaceChild(embed, this);
  });
  // Clavier : Entrée ou Espace lancent la vidéo, comme un clic
  card.querySelector('.video-thumb').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); this.click(); }
  });
});

// Fetch real titles from YouTube oEmbed (best effort)
VIDEOS.forEach(function(v) {
  fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + v.id)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.title) {
        var el = document.getElementById('title-' + v.id);
        if (el) el.textContent = data.title;
        var th = document.getElementById('thumb-' + v.id);
        if (th) th.setAttribute('aria-label', 'Lire la vid\u00e9o \u00ab ' + data.title + ' \u00bb');
      }
    })
    .catch(function() {});
});

// Theme listener
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'theme') {
    var t = e.data.theme;
    document.documentElement.setAttribute('data-theme', t);
    document.body.setAttribute('data-theme', t === 'light' ? '' : 'dark');
    // Also try calling the module's own theme function
    try { if (typeof setTheme === 'function') setTheme(t); } catch(ex) {}
    try { if (typeof S !== 'undefined' && S.th !== undefined) { S.th = t === 'light' ? 'light' : 'dark'; document.body.setAttribute('data-theme', S.th); } } catch(ex) {}
    // Force canvas/render update
    try { window.dispatchEvent(new Event('resize')); } catch(ex) {}
  }
});
try {
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.body.setAttribute('data-theme', '');
    try { if (typeof S !== 'undefined') { S.th = 'light'; document.body.setAttribute('data-theme', 'light'); } } catch(ex) {}
  }
} catch(e) {}
</script>
</body>
</html>
