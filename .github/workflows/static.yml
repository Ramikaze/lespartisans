name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Actions épinglées sur un commit (le numéro de version suit en commentaire) : une étiquette déplacée
      # chez leur auteur ne peut pas changer ce qui publie le site.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # le jeton GitHub ne reste pas dans .git (rien n'est poussé ici)
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # Sécurité : même politique (CSP) dans chaque page, lp-design.js en premier, aucun postMessage vers « * ».
      # Une page oubliée arrête la mise en ligne ; correction locale : python3 verifier_csp.py --corriger
      - name: Check security policy
        run: python3 -I verifier_csp.py
      # Seuls les fichiers du site partent en ligne : ni les scripts de travail (*.py),
      # ni les notes et brouillons nommés ci-dessous, ni .DS_Store. Les PDF et l'audio
      # restent publiés, même ceux qu'aucune page ne cite. Un futur robots.txt partirait bien.
      # shell: bash → « -eo pipefail » : si l'archivage échoue, l'étape échoue (pas de site à moitié publié).
      - name: Prepare site
        shell: bash
        run: |
          mkdir _site
          tar -cf - \
            --exclude='./.git' --exclude='./.github' --exclude='./.impeccable' --exclude='./.gitignore' --exclude='.DS_Store' \
            --exclude='*.py' --exclude='./DESIGN.md' --exclude='./PRODUCT.md' \
            --exclude='./all_data.txt' --exclude='./dua_simaat_extracted.txt' --exclude='./fra.traineddata' \
            --exclude='./old_data.js' --exclude='./dua_simaat_parsed.js' --exclude='./supp_01_raw.json' \
            --exclude='./page_0.png' --exclude='./_site' \
            . | tar -xf - -C _site
          test -f _site/index.html
          # Jeton de version des pages chargées par les accueils : le commit publié. Les pages restent
          # en cache entre deux déploiements et sont rechargées après chacun (en local : Date.now()).
          sed -i "s/__SITE_REV__/${GITHUB_SHA::12}/g" _site/index.html _site/index-classique.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
