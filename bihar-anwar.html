<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biḥār al-Anwār (L'Océan des Lumières)</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#070c18;color:#e8e2d0;font-family:'Plus Jakarta Sans',sans-serif;overflow:hidden}
.app{display:flex;height:100%}

/* Les entrées du sommaire sont des <button> : remise à zéro, sans peser sur les règles de classe */
:where(button.sb-theme,button.sb-item,button.sb-toggle){appearance:none;-webkit-appearance:none;background:none;border:0;border-radius:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.sb-theme:active,.sb-item:active{transform:none}

/* ══ SIDEBAR ══ */
.sidebar{
  width:240px;flex-shrink:0;height:100%;
  background:#0a1020;border-right:1px solid rgba(201,168,76,0.12);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width .3s cubic-bezier(.4,0,.2,1);
}
.sidebar.collapsed{width:0}
.sb-header{
  padding:16px 14px 12px;border-bottom:1px solid rgba(201,168,76,0.1);
  flex-shrink:0;
}
.sb-title{font-family:'Cinzel',serif;font-size:12px;font-weight:700;color:#c9a84c;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sb-sub{font-size:10px;color:#3a4560;margin-top:2px;white-space:nowrap}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;scrollbar-width:thin;scrollbar-color:rgba(201,168,76,0.15) transparent}
.sb-scroll::-webkit-scrollbar{width:3px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.15)}

/* Search input in sidebar */
.sb-search-container{margin-top:10px;padding:0 2px}
input.sb-search{
  width:100%;padding:8px 12px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(201,168,76,0.2);
  border-radius:6px;color:#e8e2d0;font-size:11.5px;
  font-family:inherit;outline:none;transition:border-color 0.2s;
}
input.sb-search:focus{
  border-color:#c9a84c;
}
.sb-empty{padding:12px 16px;font-size:12px;line-height:1.5;color:#9aa3b8}
.sb-empty[hidden]{display:none}

/* Section group */
.sb-group{margin-bottom:4px}
.sb-group[hidden]{display:none}
.sb-theme{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:9px 14px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:600;color:#9aa3b8;
  transition:all .18s;
  border-left:2px solid transparent;
}
.sb-theme:hover{color:#c9a84c;background:rgba(201,168,76,0.05)}
.sb-theme.open{color:#c9a84c;border-left-color:rgba(201,168,76,0.4);background:rgba(201,168,76,0.06)}
.sb-theme-icon{font-size:14px;flex-shrink:0}
.sb-theme-label{flex:1;line-height:1.4}
.sb-chevron{font-size:9px;transition:transform .2s;flex-shrink:0;color:#c9a84c;opacity:.6}
.sb-theme.open .sb-chevron{transform:rotate(90deg)}

/* Sub-items : repliés, ils ne prennent plus le focus au clavier (visibility) */
.sb-items{
  display:flex;flex-direction:column;max-height:0;overflow:hidden;visibility:hidden;
  transition:max-height .3s cubic-bezier(.4,0,.2,1),visibility 0s linear .3s;
}
.sb-items.open{max-height:10000px;visibility:visible;transition:max-height .3s cubic-bezier(.4,0,.2,1),visibility 0s}
.sb-item{
  display:block;padding:7px 14px 7px 36px;
  font-family:inherit;font-size:11.5px;color:#6b7280;cursor:pointer;
  transition:all .15s;line-height:1.4;
  border-left:2px solid transparent;
}
.sb-item[hidden]{display:none}
.sb-item:hover{color:#c9a84c;background:rgba(201,168,76,0.04)}
.sb-item.active{color:#c9a84c;font-weight:600;background:rgba(201,168,76,0.08);border-left-color:#c9a84c}

/* ══ TOGGLE BUTTON ══ */
.sb-toggle{
  position:absolute;top:50%;left:240px;transform:translateY(-50%);
  width:18px;height:48px;background:#0d1828;border:1px solid rgba(201,168,76,0.2);
  border-left:none;border-radius:0 8px 8px 0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#c9a84c;z-index:50;transition:left .3s;
}
.sb-toggle:hover{background:rgba(201,168,76,0.12)}
.sb-toggle:active{transform:translateY(-50%)}
.sidebar.collapsed~.sb-toggle{left:0}

/* ══ MAIN CONTENT ══ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

/* Content panel */
.content{
  flex:1;overflow-y:auto;padding:20px 24px 40px;
  scrollbar-width:thin;scrollbar-color:rgba(201,168,76,0.15) transparent;
  animation:fadeIn .25s ease;
}
.content:focus{outline:none}
.content-inner{
  max-width:1200px;margin:0 auto;
}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.2);border-radius:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ══ CONTENT ELEMENTS ══ */
.c-source{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#c9a84c;opacity:.5;font-family:'Cinzel',serif;margin-bottom:4px;text-align:center}
.c-title{font-family:'Cinzel',serif;font-size:20px;font-weight:700;color:#e8e2d0;line-height:1.3;margin-bottom:6px;text-align:center;overflow-wrap:anywhere}
.c-subtitle{font-size:13px;color:#9aa3b8;font-style:italic;line-height:1.6;margin-bottom:16px;text-align:center;overflow-wrap:anywhere}
.c-divider{height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.25),transparent);margin-bottom:18px}
.c-h3{font-family:'Cinzel',serif;font-size:13px;font-weight:600;color:#c9a84c;margin:4px 0 10px}

/* Versets d'ouverture du chapitre */
.c-intro{
  font-size:14.5px;color:#9aa3b8;font-style:italic;line-height:1.7;
  padding:12px 16px;border-left:2px solid rgba(201,168,76,0.3);
  background:rgba(201,168,76,0.03);border-radius:0 8px 8px 0;margin-bottom:18px;
  text-align:justify;hyphens:auto;overflow-wrap:anywhere;
}
.c-intro-label{font-size:11px;font-weight:600;font-style:normal;color:#c9a84c;margin-bottom:8px}
.c-verse + .c-verse{margin-top:.8em}
.c-verse-ref{white-space:nowrap;font-size:.86em;font-style:normal;color:#c9a84c}

/* Note de l'éditeur, clôture du volume */
.c-prose{font-size:13.5px;color:#cec6b0;line-height:1.8;text-align:justify;hyphens:auto;overflow-wrap:anywhere}
.c-prose p + p{margin-top:1em}
.c-closing{margin-top:28px;padding-top:18px;border-top:1px solid rgba(201,168,76,0.18);font-size:13px;line-height:1.7;color:#9aa3b8;overflow-wrap:anywhere}
.c-closing p + p{margin-top:.5em}

/* Hadith Card */
.hadith-card{
  margin-bottom:14px;padding:16px;
  border-radius:10px;background:rgba(255,255,255,0.018);
  border:1px solid rgba(255,255,255,0.035);
  border-left:3px solid rgba(201,168,76,0.5);
  transition:background .2s,border-color .6s,box-shadow .6s;
}
.hadith-card:hover{
  background:rgba(201,168,76,0.04);border-color:rgba(201,168,76,0.1);
}
.hadith-card.is-flash,.hadith-card.is-flash:hover{background:rgba(201,168,76,0.14);border-color:rgba(201,168,76,0.55)}
.hadith-number{
  font-family:'Cinzel',serif;font-size:11px;font-weight:700;
  color:#c9a84c;margin-bottom:8px;
}
.hadith-text{
  font-size:13.5px;color:#cec6b0;line-height:1.8;text-align:justify;hyphens:auto;overflow-wrap:anywhere;
}
.hadith-text p + p{margin-top:.75em}

/* Chaîne de transmission : repliée derrière un bouton ; seuls les transmetteurs se replient */
.isnad-toggle{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;min-height:30px;padding:0 12px;
  border-radius:999px;border:1px solid rgba(201,168,76,0.3);background:rgba(201,168,76,0.08);
  color:#c9a84c;font-family:inherit;font-size:12px;font-weight:600;line-height:1.2;cursor:pointer;
  transition:background .2s,border-color .2s;
}
.isnad-toggle:hover{background:rgba(201,168,76,0.16);border-color:rgba(201,168,76,0.5)}
.isnad-toggle .chev{display:inline-block;transition:transform .3s}
.isnad-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.isnad{margin-top:10px;font-size:12px;line-height:1.7;color:#9aa3b8;overflow-wrap:anywhere}
.isnad[hidden]{display:none}
@media (pointer:coarse){.isnad-toggle{min-height:40px}}

/* Commentaire d'al-Majlisī : un bloc à part, toujours visible */
.hadith-comment{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(106,180,232,0.06);border:1px solid rgba(106,180,232,0.2)}
.hadith-number + .hadith-comment{margin-top:0}
.hadith-comment-label{font-size:11px;font-weight:600;color:#6ab4e8;margin-bottom:6px}
.hadith-comment p{font-size:13px;line-height:1.7;color:#a8c4e0;overflow-wrap:anywhere}
.hadith-comment p + p{margin-top:.6em}

/* Hadith sauté par la traduction */
.hadith-card.is-missing{border-style:dashed;background:none}
.hadith-card.is-missing.is-flash{background:rgba(201,168,76,0.14)}
.hadith-missing{font-size:13px;color:#9aa3b8}

/* Carte PDF */
.pdf-card{background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.18);border-radius:14px;padding:28px 28px 24px;margin:24px auto 28px;max-width:700px}
.pdf-card-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pdf-card-icon{width:48px;height:48px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.25);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pdf-card-icon svg{width:26px;height:26px;color:#c9a84c}
.pdf-card-title{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:700;color:#c9a84c}
.pdf-card-subtitle{font-size:0.8rem;color:#5a6480;margin-top:2px}
.pdf-card-text{font-size:0.92rem;color:#9e9480;line-height:1.75;margin-bottom:20px;text-align:justify}
.pdf-card-actions{display:flex;flex-wrap:wrap;gap:10px}
.pdf-card-dl{display:inline-flex;align-items:center;gap:8px;background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.3);color:#c9a84c;padding:10px 22px;border-radius:10px;font-family:'Cinzel',serif;font-size:0.85rem;font-weight:600;letter-spacing:.04em;text-decoration:none;transition:all .2s;cursor:pointer}
.pdf-card-dl:hover{background:rgba(201,168,76,0.22);border-color:rgba(201,168,76,0.5);transform:translateY(-1px)}
.pdf-card-dl svg{width:18px;height:18px}

/* Bouton « haut de page » */
.scroll-top-btn{position:fixed;bottom:24px;right:24px;width:44px;height:44px;background:rgba(19,29,53,0.85);border:1px solid rgba(201,168,76,0.3);border-radius:50%;color:#c9a84c;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:all .3s ease;z-index:999;backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.scroll-top-btn.visible{opacity:1;visibility:visible;pointer-events:all}
.scroll-top-btn:hover{background:rgba(201,168,76,0.2);border-color:#c9a84c;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.4),0 0 12px rgba(201,168,76,0.15)}
.scroll-top-btn:active{transform:translateY(0)}
.scroll-top-btn svg{width:20px;height:20px}

/* ══ Light theme overrides ══ */
[data-theme="light"] body{background:#e8e0d4!important;color:#2c2114!important}
[data-theme="light"] .sidebar{background:#ddd5c6!important;border-color:rgba(122,92,36,0.15)!important}
[data-theme="light"] .sb-header{border-color:rgba(122,92,36,0.12)!important}
[data-theme="light"] .sb-title{color:#7a5c24!important}
[data-theme="light"] .sb-sub{color:#8a7c66!important}
html:not([data-design="console"])[data-theme="light"] .sb-empty{color:#6b5e48}
[data-theme="light"] .sb-theme{color:#5a4e3c!important}
[data-theme="light"] .sb-theme:hover{color:#7a5c24!important;background:rgba(122,92,36,0.06)!important}
[data-theme="light"] .sb-theme.open{color:#7a5c24!important;background:rgba(122,92,36,0.08)!important;border-left-color:rgba(122,92,36,0.4)!important}
[data-theme="light"] .sb-chevron{color:#7a5c24!important}
[data-theme="light"] .sb-item{color:#6b5e48!important}
[data-theme="light"] .sb-item:hover{color:#7a5c24!important;background:rgba(122,92,36,0.05)!important}
[data-theme="light"] .sb-item.active{color:#7a5c24!important;background:rgba(122,92,36,0.1)!important;border-left-color:#7a5c24!important}
[data-theme="light"] .sb-toggle{background:#d8d0c2!important;border-color:rgba(122,92,36,0.2)!important;color:#7a5c24!important}
[data-theme="light"] .sb-toggle:hover{background:rgba(122,92,36,0.15)!important}
[data-theme="light"] .hadith-card{background:rgba(0,0,0,0.03)!important;border-left-color:rgba(122,92,36,0.4)!important;border-color:rgba(0,0,0,0.06)!important}
html:not([data-design="console"])[data-theme="light"] .hadith-card.is-flash{background:rgba(122,92,36,0.14)!important;border-color:rgba(122,92,36,0.5)!important}
html:not([data-design="console"])[data-theme="light"] .hadith-card.is-missing{background:none!important}
html:not([data-design="console"])[data-theme="light"] .hadith-card.is-missing.is-flash{background:rgba(122,92,36,0.14)!important}
[data-theme="light"] .hadith-number{color:rgba(122,92,36,0.8)!important}
[data-theme="light"] .hadith-text{color:#3d3425!important}
html:not([data-design="console"])[data-theme="light"] .isnad-toggle{color:#7a5c24;border-color:rgba(122,92,36,0.3);background:rgba(122,92,36,0.08)}
html:not([data-design="console"])[data-theme="light"] .isnad-toggle:hover{background:rgba(122,92,36,0.16)}
html:not([data-design="console"])[data-theme="light"] .isnad,html:not([data-design="console"])[data-theme="light"] .hadith-missing{color:#5a4e3c}
html:not([data-design="console"])[data-theme="light"] .hadith-comment{background:rgba(70,120,170,0.08);border-color:rgba(70,120,170,0.2)}
html:not([data-design="console"])[data-theme="light"] .hadith-comment-label{color:#2a5080}
html:not([data-design="console"])[data-theme="light"] .hadith-comment p{color:#3a5c85}
[data-theme="light"] input#sb-search{background:rgba(0,0,0,0.03)!important;border-color:rgba(122,92,36,0.2)!important;color:#2c2114!important}
[data-theme="light"] input#sb-search:focus{border-color:#7a5c24!important}
[data-theme="light"] .c-title{color:#2c2114!important}
[data-theme="light"] .c-subtitle{color:#6b5e48!important}
[data-theme="light"] .c-source{color:#7a5c24!important}
html:not([data-design="console"])[data-theme="light"] .c-h3,html:not([data-design="console"])[data-theme="light"] .c-intro-label,html:not([data-design="console"])[data-theme="light"] .c-verse-ref{color:#7a5c24}
[data-theme="light"] .c-intro{color:#6b5e48!important;background:rgba(122,92,36,0.04)!important;border-left-color:rgba(122,92,36,0.3)!important}
[data-theme="light"] .c-divider{background:linear-gradient(90deg,rgba(122,92,36,0.25),transparent)!important}
html:not([data-design="console"])[data-theme="light"] .c-prose{color:#3d3425}
html:not([data-design="console"])[data-theme="light"] .c-closing{color:#6b5e48;border-top-color:rgba(122,92,36,0.18)}
[data-theme="light"] .pdf-card{background:rgba(122,92,36,0.04)!important;border-color:rgba(122,92,36,0.15)!important}
[data-theme="light"] .pdf-card-icon{background:rgba(122,92,36,0.08)!important;border-color:rgba(122,92,36,0.2)!important}
[data-theme="light"] .pdf-card-title{color:#7a5c24!important}
html:not([data-design="console"])[data-theme="light"] .pdf-card-subtitle{color:#6b5e48}
[data-theme="light"] .pdf-card-text{color:#5a4a30!important}
[data-theme="light"] .pdf-card-dl{background:rgba(122,92,36,0.08)!important;color:#7a5c24!important;border-color:rgba(122,92,36,0.25)!important}
[data-theme="light"] .pdf-card-dl:hover{background:rgba(122,92,36,0.16)!important}
[data-theme="light"] .scroll-top-btn{background:rgba(225,218,206,0.9)!important;border-color:rgba(122,92,36,0.25)!important;color:#7a5c24!important;box-shadow:0 4px 16px rgba(60,45,20,0.12)!important}
[data-theme="light"] .scroll-top-btn:hover{background:rgba(235,228,216,0.95)!important;border-color:#7a5c24!important;box-shadow:0 6px 20px rgba(60,45,20,0.18),0 0 12px rgba(122,92,36,0.1)!important}

/* ══ MOBILE : le panneau devient un tiroir posé au-dessus d'un voile ══ */
.sb-overlay{display:none}
@media (max-width:768px){
  .sidebar{position:fixed;top:0;left:0;z-index:100;box-shadow:10px 0 30px rgba(0,0,0,0.4)}
  .sidebar.collapsed{box-shadow:none}
  .sb-overlay{
    display:block;position:fixed;inset:0;z-index:90;
    background:rgba(0,0,0,0.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
  }
  .sidebar:not(.collapsed)~.sb-overlay{opacity:1;visibility:visible}
  /* Languette au-dessus du voile, plus facile à toucher ; le texte commence après elle */
  .sb-toggle{z-index:110;width:24px;height:56px;font-size:13px}
  .content{padding-left:36px}
  [data-theme="light"] .sb-overlay{background:rgba(44,33,20,0.3)}
  [data-theme="light"] .sidebar:not(.collapsed){box-shadow:10px 0 30px rgba(60,45,20,0.25)}
}

/* Mouvement réduit : pas de fondu à l'arrivée d'un chapitre, ni de glissement de la chaîne ou du flash */
@media (prefers-reduced-motion:reduce){
  .content{animation:none}
  .hadith-card,.isnad-toggle,.isnad-toggle .chev{transition:none!important}
}
</style>
<link rel="stylesheet" href="ios-theme.css">
<style>
/* ===== iOS deep pass — bihar-anwar ===== */
.sb-theme,.sb-item{border-left:none!important}
.sb-theme.open{border-radius:10px!important;background:rgba(201,168,76,0.08)!important}
.sb-item.active{border-radius:10px!important;background:rgba(201,168,76,0.12)!important}
input.sb-search{border-radius:10px!important;font-family:var(--ios-font)!important;background:rgba(255,255,255,0.06)!important;border-color:transparent!important}
.c-intro{border-left:none!important;border-radius:12px!important}
.sb-toggle{border-radius:0 10px 10px 0!important}
.pdf-card{border-radius:18px!important}
.pdf-card-icon{border-radius:14px!important}
.pdf-card-dl{font-family:var(--ios-font)!important;border-radius:980px!important;font-weight:600!important;letter-spacing:0!important}
</style>
<!-- Design « Console » (lp-design.js : 'console' ou 'classique') -->
<script src="lp-design.js"></script>
<script>
/* Thème du design classique (data-theme) ; la Console a son propre interrupteur (lp-design.js) */
try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="console.css">
<style id="lp-console-skin">/* Design « Console » — bihar-anwar (Biḥār al-Anwār) */
/* Éléments propres à la console */
html:not([data-design="console"]) .lp-only{display:none!important}
html[data-design="console"] .lp-only{display:block}
html[data-design="console"] .sb-title:not(.lp-only){display:none!important}

/* Jetons de la page : bouton éclairé, tuile de numéro */
html[data-design="console"]{
  --ba-lit:radial-gradient(120% 150% at 50% 125%,rgba(var(--lp-glow),.24),transparent 70%),rgba(var(--lp-glow),.06);
  --ba-lit-glow:inset 0 1px 0 rgba(255,255,255,.08),0 0 22px -6px rgba(var(--lp-glow),.55);
  --ba-lit-glow-hi:inset 0 1px 0 rgba(255,255,255,.12),0 0 34px -4px rgba(var(--lp-glow),.72);
  --ba-tile:radial-gradient(120% 120% at 50% 100%,var(--lp-lamp),transparent 72%),var(--lp-fill);
  --ba-tile-glow:inset 0 1px 0 rgba(255,255,255,.1),var(--lp-halo);
}
html[data-design="console"][data-lp-theme="light"]{

<div class="app">

  <!-- SIDEBAR : le sommaire du volume -->
  <nav class="sidebar" id="sidebar" aria-label="Sommaire du livre">

      <div class="sb-search-container">
        <input type="text" id="sb-search" class="sb-search" placeholder="Rechercher un chapitre..." aria-label="Rechercher un chapitre" autocomplete="off" spellcheck="false">
      </div>
    </div>

    </div>
  </nav>

  <!-- TOGGLE -->
  <button class="sb-toggle" id="sb-toggle" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Replier le sommaire">‹</button>

  <div class="sb-overlay" id="sb-overlay"></div>

  <!-- MAIN -->
  <main class="main" id="main">
    <div class="content" id="content" tabindex="-1">
      <div class="content-inner" id="content-inner"></div>

</div>

<button class="scroll-top-btn" id="scrollTopBtn" type="button" aria-label="Retour en haut" title="Retour en haut">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
</button>

<script>
/* Biḥār al-Anwār (al-Majlisī), traduction française de l'Édition SiratAli. Une page, deux livres :
   ?vol=1 ou ?vol=2 (le paramètre anti-cache du hub peut le suivre : ?vol=2&v=123). Les données viennent de
   bihar-anwar-N-data.js (window.BIHAR_VOLUMES[N]), chargé par un <script> créé ici.

   État de lecture (ancre #… et messages du hub) :
     ""            la Présentation
     "<chapitre>"  un chapitre, ex. s1c1
     "<chapitre>:<n>"  une fiche de ce chapitre, ex. s1c1:10 (elle défile à l'écran et brille 2 s)
   Messages reçus du hub : {type:'gs-navigate', state} et {type:'theme', theme}.
   Message envoyé au hub : {type:'nav', state} à chaque changement d'état.

   Contrat du texte (donnees = edite/) : texte brut, \n entre paragraphes, <i>…</i> seulement. Tout est
   échappé, puis seuls <i> et </i> reviennent. Rien d'autre des données n'est jamais inséré tel quel. */
(function () {
  'use strict';

  var KNOWN = [1, 2];
  var vm = /[?&]vol=(\d)/.exec(location.search);
  var VOL = vm && KNOWN.indexOf(+vm[1]) >= 0 ? +vm[1] : 1;
  var stamp = /[?&]v=(\d+)/.exec(location.search);

  var VOLUME = null;      // window.BIHAR_VOLUMES[VOL], une fois chargé
  var CHAPTERS = [];      // [{ sec, ch }] dans l'ordre du livre
  var BY_ID = Object.create(null);
  var SECTIONS = [];      // [{ id, group, head, items: [{ el, fold }], fold }]
  var current = null;     // '' (Présentation) ou l'identifiant du chapitre affiché
  var lastNav = '';       // dernier état envoyé au hub
  var pending = null;     // état demandé avant l'arrivée des données

  var $ = function (id) { return document.getElementById(id); };
  var sidebar = $('sidebar'), toggle = $('sb-toggle'), overlay = $('sb-overlay');
  var sbScroll = $('sb-scroll'), search = $('sb-search');
  var content = $('content'), inner = $('content-inner');

  document.getElementById('sb-sub').textContent = 'Volume ' + VOL;
  document.title = 'Biḥār al-Anwār — Volume ' + VOL;

  // ══ TEXTE : échappement, puis <i> seulement ══
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  // Un paragraphe : tout est échappé, <i> et </i> reviennent ; les <i> restés ouverts se ferment avec le paragraphe
  function rich(s) {
    var depth = 0, out = '';
    esc(s).split(/(&lt;\/?i&gt;)/).forEach(function (part) {
      if (part === '&lt;i&gt;') { out += '<i>'; depth++; }
      else if (part === '&lt;/i&gt;') { if (depth > 0) { out += '</i>'; depth--; } }
      else out += part;
    });
    while (depth-- > 0) out += '</i>';
    return out;
  }
  function paras(s) {
    return String(s == null ? '' : s).split('\n').filter(function (p) { return p.trim(); }).map(function (p) { return '<p>' + rich(p) + '</p>'; }).join('');
  }
  // Pour le filtre du sommaire : sans les balises <i>, NFD, sans diacritiques, minuscules ; apostrophes et ligatures ramenées au plus simple
  function fold(s) {
    return String(s == null ? '' : s).replace(/<\/?i>/g, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/œ/g, 'oe').replace(/æ/g, 'ae').replace(/[’‘ʼʻʿʾ`´]/g, "'").replace(/\s+/g, ' ').trim();
  }

  // ══ DONNÉES ══
  function indexVolume() {
    VOLUME.sections.forEach(function (sec) {
      (sec.chapters || []).forEach(function (ch) {
        CHAPTERS.push({ sec: sec, ch: ch });
        BY_ID[ch.id] = { sec: sec, ch: ch };
      });
    });
  }
  function load() {
    var s = document.createElement('script');
    s.src = 'bihar-anwar-' + VOL + '-data.js' + (stamp ? '?v=' + stamp[1] : '');
    s.onload = function () {
      var v = window.BIHAR_VOLUMES && window.BIHAR_VOLUMES[VOL];
      if (!v || !Array.isArray(v.sections)) { fail(); return; }
      VOLUME = v;
      indexVolume();
      renderSommaire();
      showState(pending !== null ? pending : fromHash());
      pending = null;
    };
    s.onerror = fail;
    document.head.appendChild(s);
  }
  function fail() {
    sbScroll.innerHTML = '<div class="sb-empty" role="status">Le sommaire n\'a pas pu être chargé.</div>';
    inner.innerHTML = '<div class="c-source">Biḥār al-Anwār · Volume ' + VOL + '</div><h2 class="c-title">Volume indisponible</h2><div class="c-divider"></div><p class="c-prose">Le volume ' + VOL + ' n\'a pas pu être chargé. Rechargez la page, ou revenez dans un instant.</p>';
  }

  // ══ SOMMAIRE ══
  function renderSommaire() {
    var h = '<div class="sb-group" id="sb-group-pres"><button class="sb-theme" id="sb-pres" type="button" data-state=""><span class="sb-theme-icon" aria-hidden="true">📖</span><span class="sb-theme-label">Présentation</span></button></div>';
    VOLUME.sections.forEach(function (sec) {
      var sid = esc(sec.id), label = [sec.label, sec.title].filter(Boolean).join(' — ');
      h += '<div class="sb-group" id="sb-group-' + sid + '">' +
        '<button class="sb-theme open" type="button" data-group="' + sid + '" aria-expanded="true" aria-controls="sb-items-' + sid + '">' +
        '<span class="sb-theme-icon" aria-hidden="true">🗂️</span><span class="sb-theme-label">' + rich(label) + '</span><span class="sb-chevron" aria-hidden="true">›</span></button>' +
        '<div class="sb-items open" id="sb-items-' + sid + '">';
      (sec.chapters || []).forEach(function (ch) {
        h += '<button class="sb-item" id="sb-item-' + esc(ch.id) + '" type="button" data-state="' + esc(ch.id) + '">' + esc(ch.n) + '. ' + rich(ch.title) + '</button>';
      });
      h += '</div></div>';
    });
    h += '<div class="sb-empty" id="sb-empty" role="status" hidden>Aucun chapitre ne correspond.</div>';
    sbScroll.innerHTML = h;

    SECTIONS = VOLUME.sections.map(function (sec) {
      var group = $('sb-group-' + sec.id);
      return {
        id: sec.id, group: group, head: group.querySelector('.sb-theme'), body: group.querySelector('.sb-items'),
        fold: fold([sec.label, sec.title].filter(Boolean).join(' ')),
        items: (sec.chapters || []).map(function (ch) { var el = $('sb-item-' + ch.id); return { el: el, fold: fold(ch.n + '. ' + ch.title) }; })
      };
    });
  }
  function setGroup(sec, open) {
    sec.head.classList.toggle('open', open);
    sec.body.classList.toggle('open', open);
    sec.head.setAttribute('aria-expanded', String(open));
  }
  function secOf(chId) {
    var r = BY_ID[chId];
    return r && SECTIONS.filter(function (s) { return s.id === r.sec.id; })[0];
  }
  // Filtre : les mots tapés doivent tous se lire dans le titre (casse, accents et apostrophes ignorés)
  function filterSidebar() {
    if (!VOLUME) return;
    var words = fold(search.value).split(' ').filter(Boolean);
    var hit = function (f) { return words.every(function (w) { return f.indexOf(w) >= 0; }); };
    var any = false;
    var pres = $('sb-group-pres');
    pres.hidden = !(!words.length || hit(fold('Présentation')));
    any = !pres.hidden;
    SECTIONS.forEach(function (sec) {
      var hits = sec.items.filter(function (it) { return !words.length || hit(it.fold); });
      sec.items.forEach(function (it) { it.el.hidden = !(!words.length || hit(it.fold) || (!hits.length && hit(sec.fold))); });
      if (!words.length) { sec.group.hidden = false; setGroup(sec, true); any = true; }
      else if (hits.length) { sec.group.hidden = false; setGroup(sec, true); any = true; }
      else if (hit(sec.fold)) { sec.group.hidden = false; setGroup(sec, false); any = true; }
      else sec.group.hidden = true;
    });
    $('sb-empty').hidden = any;
  }
  function markActive(key, user) {
    Array.prototype.forEach.call(sbScroll.querySelectorAll('.active'), function (e) { e.classList.remove('active'); e.removeAttribute('aria-current'); });
    var el = $(key ? 'sb-item-' + key : 'sb-pres');
    if (!el) return;
    el.classList.add('active');
    el.setAttribute('aria-current', 'true');
    if (key) { var sec = secOf(key); if (sec && !el.hidden && !sec.body.classList.contains('open') && !search.value) setGroup(sec, true); }
    // Seule la liste du menu défile (un scrollIntoView décalerait aussi le panneau replié)
    if (!user && sbScroll.clientHeight) sbScroll.scrollTop += el.getBoundingClientRect().top - sbScroll.getBoundingClientRect().top - sbScroll.clientHeight / 3;
  }

  // ══ PRÉSENTATION ══
  var ICON_FILE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>';
  var ICON_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
  var ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

  function pdfCard() {
    var pdf = VOLUME.pdf;
    if (!pdf || !/^[\w.\-]+\.pdf$/i.test(pdf.href || '')) return '';
    var href = esc(pdf.href);
    return '<div class="pdf-card">' +
      '<div class="pdf-card-head"><div class="pdf-card-icon">' + ICON_FILE + '</div><div>' +
      '<div class="pdf-card-title">Biḥār al-Anwār, volume ' + VOL + ' — Édition SiratAli</div>' +
      '<div class="pdf-card-subtitle">PDF' + (pdf.size ? ' · ' + esc(pdf.size) : '') + '</div></div></div>' +
      '<div class="pdf-card-text">Le livre complet tel que l\'Édition SiratAli l\'a publié en 2021, sans aucune retouche.</div>' +
      '<div class="pdf-card-actions">' +
      '<a class="pdf-card-dl" href="' + href + '" target="_blank" rel="noopener">' + ICON_OPEN + 'Ouvrir le PDF</a>' +
      '<a class="pdf-card-dl is-quiet" href="' + href + '" download>' + ICON_DL + 'Télécharger</a>' +
      '</div></div>';
  }
  function renderPresentation() {
    var p = VOLUME.presentation || {};
    // Les crédits tiennent la place de la source (.c-source) de L'Aune ; dans le DOM ils suivent le titre,
    // comme à l'écran (en Console, l'ordre visuel est réglé par flex : titre, sous-titre, sources, filet)
    var h = '<h2 class="c-title">Présentation</h2>' +
      '<div class="c-subtitle">Biḥār al-Anwār — L\'Océan des Lumières · Volume ' + VOL + '</div>' +
      '<div class="c-source">Auteur : Muḥammad Bāqir al-Majlisī</div>' +
      '<div class="c-source">Traduction française : Édition SiratAli (équipe bénévole), 2021</div>' +
      '<div class="c-source">www.siratali.org (site aujourd\'hui hors ligne)</div>' +
      '<div class="c-source">Noms et formules suivent les conventions du site ; les fautes évidentes ont été corrigées</div>' +
      '<div class="c-divider"></div>';
    var note = (p.note || []).map(function (t) { return paras(t); }).join('');
    if (note) h += '<h3 class="c-h3">Note de l\'éditeur</h3><div class="c-prose">' + note + '</div>';
    return h + pdfCard();
  }

  // ══ CHAPITRE ══
  function versesHtml(ch) {
    var vs = (ch.verses || []).filter(function (v) { return v && v.text; });
    if (!vs.length) return '';
    return '<div class="c-intro"><div class="c-intro-label">Les versets</div>' + vs.map(function (v) {
      return '<p class="c-verse">' + rich(v.text) + (v.ref ? ' <span class="c-verse-ref">(' + esc(v.ref) + ')</span>' : '') + '</p>';
    }).join('') + '</div>';
  }
  // Une fiche : pastille, parole, bouton et chaîne, commentaire. Une fiche sautée par la traduction n'a que sa pastille.
  function cardHtml(ch, h, i) {
    var id = 'h-' + ch.id + '-' + h.n;
    var num = '<div class="hadith-number">Hadith n°' + esc(h.n) + '</div>';
    if (h.missing) return '<div class="hadith-card is-missing" id="' + esc(id) + '">' + num + '<p class="hadith-missing">Non traduit dans l\'édition SiratAli</p></div>';
    var html = num;
    if (h.text && String(h.text).trim()) html += '<div class="hadith-text">' + paras(h.text) + '</div>';
    if (h.chain && String(h.chain).trim()) {
      var cid = 'isnad-' + ch.id + '-' + i;   // l'indice, non le numéro : deux fiches n° 60 ne partagent pas leur chaîne
      html += '<button class="isnad-toggle" type="button" aria-expanded="false" aria-controls="' + esc(cid) + '"><span class="chev" aria-hidden="true">›</span>Chaîne de transmission</button>' +
        '<p class="isnad" id="' + esc(cid) + '" hidden>' + String(h.chain).split('\n').filter(function (l) { return l.trim(); }).map(rich).join('<br>') + '</p>';
    }
    if (h.comment && String(h.comment).trim()) html += '<div class="hadith-comment"><div class="hadith-comment-label">Commentaire d\'al-Majlisī</div>' + paras(h.comment) + '</div>';
    return '<div class="hadith-card" id="' + esc(id) + '">' + html + '</div>';
  }
  function renderChapter(r) {
    var ch = r.ch, sec = r.sec;
    var h = '<div class="c-source">Biḥār al-Anwār · Volume ' + VOL + '</div>' +
      '<h2 class="c-title">Chapitre ' + esc(ch.n) + ' — ' + rich(ch.title) + '</h2>' +
      '<div class="c-subtitle">' + rich([sec.label, sec.title].filter(Boolean).join(' — ')) + '</div>' +
      '<div class="c-divider"></div>' + versesHtml(ch);
    (ch.hadiths || []).forEach(function (hd, i) { h += cardHtml(ch, hd, i); });
    // La clôture du volume vient après la dernière fiche du dernier chapitre
    var last = CHAPTERS[CHAPTERS.length - 1];
    var closing = ((VOLUME.presentation || {}).closing || []).map(function (t) { return paras(t); }).join('');
    if (last && last.ch === ch && closing) h += '<div class="c-closing">' + closing + '</div>';
    return h;
  }

  // ══ ÉTAT : "", "<chapitre>", "<chapitre>:<n>" ══
  function parseState(state) {
    var s = String(state == null ? '' : state).replace(/^#/, '');
    var i = s.indexOf(':');
    var id = i < 0 ? s : s.slice(0, i), n = i < 0 ? '' : s.slice(i + 1);
    var r = id ? BY_ID[id] : null;
    return { r: r || null, n: r && n ? n : null };
  }
  function fromHash() {
    var h = location.hash.replace(/^#/, '');
    try { h = decodeURIComponent(h); } catch (e) {}
    return h;
  }
  var flashEl = null, flashTimer = 0;
  // La fiche s'allume deux secondes. Redemandée pendant ce temps (ancre, puis message du hub), elle ne clignote pas : le délai repart.
  function flash(el) {
    if (flashEl && flashEl !== el) flashEl.classList.remove('is-flash');
    clearTimeout(flashTimer);
    flashEl = el;
    el.classList.add('is-flash');
    flashTimer = setTimeout(function () { el.classList.remove('is-flash'); if (flashEl === el) flashEl = null; }, 2000);
  }
  function place(el) {
    var box = content.getBoundingClientRect(), r = el.getBoundingClientRect();
    content.scrollTop += r.top - box.top - Math.round(box.height * 0.16);
  }
  function reveal(el) {
    place(el);
    // Les polices arrivent après ce premier calcul et changent la hauteur des lignes : on recale une seule fois à leur arrivée,
    // sauf si le lecteur a déjà défilé de plus de 40 px (l'ancrage du défilement du navigateur peut déjà avoir bougé un peu)
    if (document.fonts && document.fonts.status !== 'loaded') {
      var at = content.scrollTop;
      document.fonts.ready.then(function () { if (el.isConnected && Math.abs(content.scrollTop - at) < 40) place(el); });
    }
  }
  function phone() { return window.matchMedia('(max-width: 768px)').matches; }
  function sync(state) {
    try {
      var base = location.pathname + location.search, url = base + (state ? '#' + state : '');
      if (url !== base + location.hash) history.replaceState(null, '', url);
    } catch (e) {}
    if (state !== lastNav) {
      lastNav = state;
      try { if (window.parent !== window) window.parent.postMessage({ type: 'nav', state: state }, '*'); } catch (e) {}
    }
  }
  function showState(state, opts) {
    opts = opts || {};
    if (!VOLUME) { pending = String(state == null ? '' : state); return; }
    var t = parseState(state);
    var key = t.r ? t.r.ch.id : '';
    var changed = key !== current;
    if (changed) {
      inner.innerHTML = t.r ? renderChapter(t.r) : renderPresentation();
      current = key;
      content.scrollTop = 0;
      // Fondu d'arrivée, comme L'Aune
      content.style.animation = 'none';
      void content.offsetHeight;
      content.style.animation = '';
    }
    markActive(key, opts.user);
    var card = t.r && t.n !== null ? $('h-' + key + '-' + t.n) : null;   // deux fiches de même numéro : la première
    if (card) { reveal(card); flash(card); }
    else if (!changed && opts.user) content.scrollTop = 0;
    if (phone() && !sidebar.classList.contains('collapsed')) {
      setDrawer(false);
      if (opts.user) content.focus({ preventScroll: true });
    }
    sync(card ? key + ':' + t.n : key);
  }

  // ══ TIROIR ══
  var drawerOpen = true;
  function setDrawer(open) {
    // Un panneau fermé devient inert : le focus qu'il portait irait au <body>. Il passe d'abord à la languette.
    if (!open && sidebar.contains(document.activeElement)) toggle.focus({ preventScroll: true });
    drawerOpen = open;
    sidebar.classList.toggle('collapsed', !open);
    toggle.textContent = open ? '‹' : '›';
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'Replier le sommaire' : 'Déplier le sommaire');
    if ('inert' in sidebar) sidebar.inert = !open;
  }
  toggle.addEventListener('click', function () { setDrawer(!drawerOpen); });
  overlay.addEventListener('click', function () { if (phone()) setDrawer(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && phone() && drawerOpen) setDrawer(false);
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      try { window.parent.postMessage({ type: 'gs-open' }, '*'); } catch (ex) {}
    }
  });
  // À l'arrivée sur téléphone le tiroir est déjà fermé, sans glissement visible
  if (phone()) {
    sidebar.style.setProperty('transition', 'none', 'important');
    setDrawer(false);
    requestAnimationFrame(function () { requestAnimationFrame(function () { sidebar.style.removeProperty('transition'); }); });
  } else setDrawer(true);

  // ══ ÉCOUTEURS ══
  sbScroll.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !sbScroll.contains(b)) return;
    if (b.hasAttribute('data-state')) showState(b.getAttribute('data-state'), { user: true });
    else if (b.hasAttribute('data-group')) {
      var sec = SECTIONS.filter(function (s) { return s.id === b.getAttribute('data-group'); })[0];
      if (sec) setGroup(sec, !sec.body.classList.contains('open'));
    }
  });
  search.addEventListener('input', filterSidebar);
  // Chaîne de transmission : un clic la déplie ou la replie
  inner.addEventListener('click', function (e) {
    var b = e.target.closest('.isnad-toggle');
    if (!b) return;
    var open = b.getAttribute('aria-expanded') === 'true', p = b.nextElementSibling;
    b.setAttribute('aria-expanded', String(!open));
    if (p) p.hidden = open;
  });
  window.addEventListener('hashchange', function () { showState(fromHash()); });
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent && e.source !== window) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'theme') {
      document.documentElement.setAttribute('data-theme', d.theme === 'light' ? 'light' : 'dark');
    } else if (d.type === 'gs-navigate' && typeof d.state === 'string') {
      showState(d.state);
    }
  });

  // ══ BOUTON « HAUT DE PAGE » (seul #content défile) ══
  var topBtn = $('scrollTopBtn');
  function checkTop() { topBtn.classList.toggle('visible', content.scrollTop > 250); }
  content.addEventListener('scroll', checkTop, { passive: true });
  topBtn.addEventListener('click', function () {
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    content.scrollTo({ top: 0, behavior: calm ? 'auto' : 'smooth' });
  });
  checkTop();

  // Seule entrée publique de la page (les contrôles de .claude/bihar-tools/check-page.js s'en servent)
  window.biharPage = { showState: showState, filterSidebar: filterSidebar, renderSommaire: renderSommaire, volume: function () { return VOL; } };
  load();
})();
</script>
</body>
</html>
